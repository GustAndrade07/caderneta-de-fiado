spring.application.name=caderneta-fiado
server.port=8080

# Evita que logs DEBUG do Spring MVC registrem senhas recebidas e tokens retornados
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO

# Banco de dados SQLite (arquivo fiado.db criado na pasta backend ao iniciar)
spring.datasource.url=jdbc:sqlite:fiado.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Cria e atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# SQLite aceita apenas uma escrita por vez
spring.datasource.hikari.maximum-pool-size=1

# Segurança JWT
# A chave vem da variável de ambiente JWT_SECRET e nunca fica no repositório.
# Sem ela, em desenvolvimento a aplicação sobe com uma chave aleatória e avisa no log
# (quem reinicia precisa fazer login de novo). No perfil prod, faltar a variável derruba a aplicação.
app.jwt.segredo=${JWT_SECRET:}
app.jwt.expiracao-horas=24
# Origens que podem chamar a API. O app roda no celular e chama o IP do PC, por isso o * no desenvolvimento.
app.jwt.origens-liberadas=*
