spring.application.name=caderneta-fiado
server.port=8080

# Banco de dados SQLite (arquivo fiado.db criado na pasta backend ao iniciar)
spring.datasource.url=jdbc:sqlite:fiado.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Cria e atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# SQLite aceita apenas uma escrita por vez
spring.datasource.hikari.maximum-pool-size=1
