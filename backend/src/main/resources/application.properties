spring.application.name=caderneta-fiado
server.port=8080

logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO

spring.datasource.url=jdbc:sqlite:fiado.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=1

app.jwt.segredo=${JWT_SECRET:}
app.jwt.expiracao-horas=24
app.jwt.origens-liberadas=*
